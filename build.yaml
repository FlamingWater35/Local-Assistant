# build_runner configuration.
#
# The slang_build_runner builder is DISABLED here because it cannot express
# slang.yaml's `output_directory`/`output_file_name` in build_runner's
# output graph (its buildExtensions maps every .i18n.json to a same-dir
# .g.dart, so any custom output path throws InvalidOutputException and
# aborts the whole build_runner run — which also starves riverpod,
# auto_route and hive_ce of their generated files).
#
# Translations are generated by the standalone CLI instead:
#   dart run slang
# (already a step in scripts/run_build.py), which honors slang.yaml and
# writes lib/i18n/generated/translations*.g.dart.
targets:
  $default:
    builders:
      slang_build_runner:
        enabled: false
